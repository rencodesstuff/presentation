<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISB16204 · OS Final Exam Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e17;--surface:#131826;--card:#1a2030;--border:#252e42;--border2:#2e3a52;
  --text:#c8d3e8;--muted:#5c6a85;--dim:#8090aa;
  --blue:#4f9eff;--green:#3dd68c;--amber:#f5a623;--purple:#a78bfa;--red:#f06a6a;--teal:#2dd4bf;--pink:#f472b6;
  --font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --r:8px;--r-lg:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
.header-left .eyebrow{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:var(--mono)}
.header-left h1{font-size:16px;font-weight:700;color:var(--amber);margin-top:2px}
.header-tags{display:flex;gap:5px;flex-wrap:wrap}
.htag{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:4px;font-family:var(--mono)}
.main-body{display:flex;flex:1}
.sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--border);padding:12px 0;display:none;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
.sidebar-btn{width:100%;background:transparent;border:none;border-left:3px solid transparent;padding:11px 16px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;transition:background .15s,border-color .15s;border-bottom:1px solid var(--border);font-family:var(--font)}
.sidebar-btn:hover{background:rgba(255,255,255,.04)}
.sidebar-btn.active{background:color-mix(in srgb,var(--ac,var(--amber)) 10%,transparent);border-left-color:var(--ac,var(--amber))}
.sidebar-btn .qnum{font-family:var(--mono);font-size:12px;font-weight:700;min-width:26px}
.sidebar-btn .qtitle{font-size:12px;font-weight:600;line-height:1.3}
.sidebar-btn .qsub{font-size:10px;color:var(--muted);margin-top:2px}
.mobile-nav{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;display:flex;scrollbar-width:none;-ms-overflow-style:none;position:sticky;top:57px;z-index:90}
.mobile-nav::-webkit-scrollbar{display:none}
.mobile-tab{flex-shrink:0;padding:10px 14px;background:transparent;border:none;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.content{flex:1;padding:24px 18px;max-width:960px;min-width:0}
.q-panel{display:none}
.q-panel.active{display:block}
/* typography */
.q-header{margin-bottom:22px}
.tag-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:20px;font-family:var(--mono)}
.q-header h2{font-size:22px;font-weight:700}
.section-title{font-size:11px;color:var(--amber);letter-spacing:2px;text-transform:uppercase;font-family:var(--mono);margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.concept-box{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:20px;line-height:1.75}
.concept-box p{color:var(--text);font-size:13px;margin-bottom:10px}
.concept-box p:last-child{margin-bottom:0}
.concept-box strong{color:var(--amber);font-weight:600}
.concept-box em{color:var(--teal);font-style:normal;font-weight:500}
.highlight-box{border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:13px;line-height:1.7}
.highlight-box strong{font-weight:700}
/* formula boxes */
.formula{background:rgba(79,158,255,.08);border:1px solid rgba(79,158,255,.25);border-radius:var(--r);padding:12px 16px;margin:12px 0;font-family:var(--mono);font-size:13px;color:var(--blue)}
.formula .f-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--font)}
.formula .f-eq{color:var(--blue);font-size:14px}
/* steps */
.steps-container{margin:14px 0}
.step-row{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.step-num{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:700;font-family:var(--mono);margin-top:1px}
.step-body{flex:1}
.step-title{font-size:13px;font-weight:600;margin-bottom:3px}
.step-detail{font-size:12px;color:var(--dim);line-height:1.65}
.step-calc{font-family:var(--mono);font-size:12px;color:var(--teal);background:rgba(45,212,191,.07);border-radius:4px;padding:6px 10px;margin-top:6px;display:inline-block}
/* toggle group */
.toggle-group{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.toggle-btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;transition:all .15s}
.toggle-btn:hover{border-color:var(--dim);color:var(--text)}
.toggle-btn.active{font-weight:700}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
thead tr{background:var(--border)}
th{padding:9px 13px;color:var(--muted);font-weight:600;text-align:center;font-size:11px;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
th.left{text-align:left}
td{padding:8px 13px;text-align:center;border-bottom:1px solid var(--border)}
td.left{text-align:left}
tbody tr:nth-child(even){background:var(--surface)}
tbody tr:nth-child(odd){background:var(--card)}
.tbl-note{color:var(--muted);font-size:11px;margin-top:6px;font-family:var(--mono)}
/* gantt */
.gantt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px}
.gantt-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-family:var(--mono)}
.gantt-bar{display:flex;height:48px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.gantt-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--border)}
.gantt-seg:last-child{border-right:none}
.gantt-seg .seg-name{font-size:12px;font-weight:700;font-family:var(--mono)}
.gantt-seg .seg-len{font-size:9px;margin-top:1px}
.gantt-times{display:flex;margin-top:5px}
.gantt-times .gt{font-size:10px;color:var(--muted);font-family:var(--mono)}
/* stat cards */
.stat-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat-card{flex:1 1 80px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;text-align:center}
.stat-card .slabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.stat-card .sval{font-size:26px;font-weight:700;font-family:var(--mono)}
/* svg graphics */
.svg-graphic{width:100%;overflow-x:auto;margin:16px 0;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--card);padding:10px}
.svg-graphic svg{display:block;margin:0 auto}
/* badge */
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;font-family:var(--mono);letter-spacing:.5px;white-space:nowrap}
.badge-hit{background:rgba(61,214,140,.15);color:#3dd68c;border:1px solid rgba(61,214,140,.3)}
.badge-fault{background:rgba(240,106,106,.15);color:#f06a6a;border:1px solid rgba(240,106,106,.3)}
.badge-pass{background:rgba(61,214,140,.15);color:#3dd68c}
.badge-warn{background:rgba(245,166,35,.15);color:#f5a623}
/* grid of 2 */
.two-col{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
/* safe sequence */
.seq-flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px}
.seq-node{padding:7px 18px;border-radius:20px;font-size:14px;font-weight:700;font-family:var(--mono)}
/* io */
.io-tab{padding:10px 14px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;cursor:pointer;font-family:var(--font);text-align:left;transition:all .15s;flex:1 1 120px}
.io-tab .it-title{font-size:13px;font-weight:600}
.io-tab .it-sub{font-size:10px;opacity:.7;margin-top:2px}
.io-panel{border-radius:var(--r-lg);padding:20px;margin-bottom:18px}
/* method cards */
.method-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.method-card{flex:1 1 180px;border-radius:var(--r-lg);padding:16px 18px}
/* comparison table highlight */
.cmp-good{color:var(--green);font-weight:600}
.cmp-bad{color:var(--red);font-weight:600}
.cmp-mid{color:var(--amber);font-weight:500}
/* page table highlight */
.frame-active{background:rgba(245,166,35,.18);padding:1px 5px;border-radius:3px;font-family:var(--mono)}
.frame-hit{background:rgba(61,214,140,.18);padding:1px 5px;border-radius:3px;font-family:var(--mono)}
/* callout */
.callout{border-left:3px solid;border-radius:0 var(--r) var(--r) 0;padding:12px 16px;margin:14px 0;font-size:13px;line-height:1.7}
/* timeline graphic */
.tl-row{display:flex;align-items:center;gap:0;margin:8px 0}
.tl-block{display:flex;align-items:center;justify-content:center;height:38px;font-size:11px;font-weight:700;font-family:var(--mono);border-radius:0;position:relative}
.tl-block:first-child{border-radius:var(--r) 0 0 var(--r)}
.tl-block:last-child{border-radius:0 var(--r) var(--r) 0}
/* responsive */
@media(min-width:700px){.sidebar{display:block}.mobile-nav{display:none}.content{padding:28px 32px}.two-col{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.content{padding:32px 40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="header-left">
    <div class="eyebrow">ISB16204 &nbsp;·&nbsp; June 2026 &nbsp;·&nbsp; Revision Final Test</div>
    <h1>OS Exam — Complete Study Guide</h1>
  </div>
  <div class="header-tags">
    <span class="htag" style="background:rgba(79,158,255,.15);color:var(--blue)">CPU</span>
    <span class="htag" style="background:rgba(167,139,250,.15);color:var(--purple)">MEM</span>
    <span class="htag" style="background:rgba(61,214,140,.15);color:var(--green)">SYNC</span>
    <span class="htag" style="background:rgba(245,166,35,.15);color:var(--amber)">FILE</span>
    <span class="htag" style="background:rgba(240,106,106,.15);color:var(--red)">I/O</span>
  </div>
</header>
<div class="main-body">
<nav class="sidebar" id="sidebar"></nav>
<div class="mobile-nav" id="mobile-nav"></div>
<main class="content" id="content"></main>
</div>
</div>
<script>
const questions=[
  {num:'Q1',title:'Priority Scheduling',sub:'Non-preemptive',tag:'CPU',color:'var(--blue)'},
  {num:'Q2',title:'SJF & Round Robin',sub:'Gantt + averages',tag:'CPU',color:'var(--blue)'},
  {num:'Q3',title:'Memory Allocation',sub:'First/Next/Best Fit',tag:'MEM',color:'var(--purple)'},
  {num:'Q4',title:'Page Replacement',sub:'FIFO · LRU · Optimal',tag:'MEM',color:'var(--purple)'},
  {num:'Q5',title:"Banker's Algorithm",sub:'Safety & deadlock',tag:'SYNC',color:'var(--green)'},
  {num:'Q6',title:'File Allocation',sub:'3 methods compared',tag:'FILE',color:'var(--amber)'},
  {num:'Q7',title:'I/O Techniques',sub:'CPU performance',tag:'I/O',color:'var(--red)'},
];

/* ── helpers ── */
function hl(color,label,text){return`<div class="highlight-box" style="background:${color}18;border:1px solid ${color}44"><strong style="color:${color}">${label}:</strong> ${text}</div>`}
function pill(color,text){return`<span class="pill" style="background:${color}18;color:${color}">${text}</span>`}
function mono(t){return`<span style="font-family:var(--mono);color:var(--teal)">${t}</span>`}
function colr(color,t,bold){return`<span style="color:${color}${bold?';font-weight:700':''}">${t}</span>`}
function formula(label,eq){return`<div class="formula"><div class="f-label">${label}</div><div class="f-eq">${eq}</div></div>`}
function callout(color,text){return`<div class="callout" style="border-color:${color};background:${color}0d;color:var(--text)">${text}</div>`}
function secTitle(t){return`<div class="section-title">${t}</div>`}
function badge(cls,t){return`<span class="badge ${cls}">${t}</span>`}

function tbl(headers,rows,foot,note){
  const ths=headers.map(h=>`<th>${h}</th>`).join('');
  const trs=rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="left"':''}>${c}</td>`).join('')}</tr>`).join('');
  const tf=foot?`<tr style="background:rgba(245,166,35,.1);border-top:2px solid rgba(245,166,35,.4)">${foot.map((c,i)=>`<td${i===0?' class="left"':''}style="font-weight:700;color:var(--amber)">${c}</td>`).join('')}</tr>`:'';
  return`<div class="tbl-wrap"><table><thead><tr>${ths}</tr></thead><tbody>${trs}${tf}</tbody></table></div>${note?`<p class="tbl-note">${note}</p>`:''}`;
}

function toggleGroup(opts,active,fn){
  return`<div class="toggle-group">${opts.map((o,i)=>`<button class="toggle-btn${i===active?' active':''}" style="${i===active?`border-color:${o.c||'var(--amber)'};background:${o.c||'var(--amber)'}22;color:${o.c||'var(--amber)'}`:''}" onclick="${fn}(${i})">${o.l}</button>`).join('')}</div>`;
}

function gantt(segs,maxT,cmap){
  const total=segs.reduce((s,x)=>s+x.l,0);
  const bars=segs.map(s=>{
    const c=cmap[s.p]||'var(--muted)';
    return`<div class="gantt-seg" style="flex:${s.l};background:${c}${s.p==='idle'?'10':'22'}">
      <span class="seg-name" style="color:${c};font-size:${segs.length>12?'9px':'12px'}">${s.p==='idle'?'—':s.p}</span>
      ${segs.length<=10?`<span class="seg-len" style="color:${c}99">${s.l}</span>`:''}
    </div>`;
  }).join('');
  const times=segs.map(s=>`<div class="gt" style="flex:${s.l}">${s.s}</div>`).join('')+`<span class="gt">${maxT}</span>`;
  return`<div class="gantt-wrap"><div class="gantt-bar">${bars}</div><div class="gantt-times">${times}</div></div>`;
}

const cmap={P1:'var(--blue)',P2:'var(--green)',P3:'var(--purple)',P4:'var(--amber)',P5:'var(--red)',idle:'var(--muted)'};

/* ===================== Q1 ===================== */
function renderQ1(){
  return`
<div class="q-header">
  <div class="tag-row">${pill('var(--blue)','CPU')}<span style="color:var(--muted);font-size:11px">Non-preemptive priority</span></div>
  <h2>${colr('var(--blue)','Q1')} · Priority Scheduling</h2>
</div>

<div class="concept-box">
  <p><strong>What is Priority Scheduling?</strong> Each process is assigned a priority number. The CPU always runs the highest-priority ready process. In <em>non-preemptive</em> mode, once a process starts it runs to completion — nothing can interrupt it mid-execution.</p>
  <p><strong>Key rule in this question:</strong> Lower priority number = higher priority. P2 (priority 1) runs first; P4 (priority 5) runs last.</p>
  <p><strong>All processes arrive at t = 0</strong>, so there is no wait for arrivals — we simply rank them by priority and execute in order.</p>
</div>

${secTitle('Step 1 — Sort by priority number')}
${tbl(
  ['Process','Burst Time','Priority','Execution Order'],
  [
    [colr('var(--green)','P2',true),'1','1 ← highest',colr('var(--green)','1st')],
    [colr('var(--amber)','P5',true),'5','2',colr('var(--amber)','2nd')],
    [colr('var(--blue)','P1',true),'10','3',colr('var(--blue)','3rd')],
    [colr('var(--purple)','P3',true),'2','4',colr('var(--purple)','4th')],
    [colr('var(--red)','P4',true),'1','5 ← lowest',colr('var(--red)','5th')],
  ],null,'Priority number 1 = highest, 5 = lowest'
)}

${secTitle('Step 2 — Draw Gantt chart')}
<div class="concept-box" style="margin-bottom:12px">
  <p>Each process runs to completion before the next starts. P2 runs 0→1 (burst=1), then P5 runs 1→6 (burst=5), and so on.</p>
</div>
${gantt([{p:'P2',l:1,s:0},{p:'P5',l:5,s:1},{p:'P1',l:10,s:6},{p:'P3',l:2,s:16},{p:'P4',l:1,s:18}],19,cmap)}

${secTitle('Step 3 — Calculate Waiting Time (WT) and Turnaround Time (TAT)')}
${formula('Formulas (all arrive at t = 0)',
  'Waiting Time (WT) = Start Time − Arrival Time = Start Time<br>Turnaround Time (TAT) = Finish Time − Arrival Time = Finish Time'
)}
<div class="concept-box">
  <p>Since all processes arrive at t = 0, <em>Waiting Time = Start Time</em> and <em>TAT = Finish Time</em>.</p>
  <p>For example, <strong>P1 starts at t = 6</strong> (waiting for P2 and P5 to finish), so <em>WT(P1) = 6</em>. P1 finishes at t = 16, so <em>TAT(P1) = 16</em>.</p>
</div>
${tbl(
  ['Process','Burst','Priority','Start','Finish',colr('var(--green)','WT'),colr('var(--blue)','TAT'),'WT calculation'],
  [
    [colr('var(--green)','P2',true),'1','1','0','1',colr('var(--green)','0'),colr('var(--blue)','1'),mono('0 − 0 = 0')],
    [colr('var(--amber)','P5',true),'5','2','1','6',colr('var(--green)','1'),colr('var(--blue)','6'),mono('1 − 0 = 1')],
    [colr('var(--blue)','P1',true),'10','3','6','16',colr('var(--green)','6'),colr('var(--blue)','16'),mono('6 − 0 = 6')],
    [colr('var(--purple)','P3',true),'2','4','16','18',colr('var(--green)','16'),colr('var(--blue)','18'),mono('16 − 0 = 16')],
    [colr('var(--red)','P4',true),'1','5','18','19',colr('var(--green)','18'),colr('var(--blue)','19'),mono('18 − 0 = 18')],
  ],null,'WT = Start Time (since all arrive at t=0) | TAT = Finish Time'
)}

${secTitle('Step 4 — Calculate Averages')}
${formula('Average Waiting Time',
  'Avg WT = (0 + 1 + 6 + 16 + 18) ÷ 5 = 41 ÷ 5 = <span style="color:var(--green);font-size:16px">8.2</span>'
)}
${formula('Average Turnaround Time',
  'Avg TAT = (1 + 6 + 16 + 18 + 19) ÷ 5 = 60 ÷ 5 = <span style="color:var(--green);font-size:16px">12.0</span>'
)}
${callout('var(--amber)','<strong>Why is P3 waiting so long?</strong> Even though P3 only needs 2 units of CPU time (burst=2), it has priority 4 — so it must wait for P2 (1), P5 (5), and P1 (10) to all finish first. This is a known weakness of priority scheduling: low-priority processes can starve.')}
`;
}

/* ===================== Q2 ===================== */
let q2m=0;
function renderQ2(){
  const opts=[
    {l:'SJF Preemptive',c:'var(--blue)'},
    {l:'SJF Non-Preemptive',c:'var(--green)'},
    {l:'Round Robin q=2',c:'var(--red)'},
  ];
  const sjfSegs=[{p:'idle',l:1,s:0},{p:'P1',l:2,s:1},{p:'P2',l:5,s:3},{p:'P4',l:6,s:8},{p:'P5',l:7,s:14},{p:'P3',l:8,s:21}];
  const rrSegs=[{p:'idle',l:1,s:0},{p:'P1',l:2,s:1},{p:'P2',l:2,s:3},{p:'P3',l:2,s:5},{p:'P2',l:2,s:7},{p:'P4',l:2,s:9},{p:'P3',l:2,s:11},{p:'P2',l:1,s:13},{p:'P5',l:2,s:14},{p:'P4',l:2,s:16},{p:'P3',l:2,s:18},{p:'P5',l:2,s:20},{p:'P4',l:2,s:22},{p:'P3',l:2,s:24},{p:'P5',l:2,s:26},{p:'P5',l:1,s:28}];
  const segs=q2m<2?sjfSegs:rrSegs;

  const sjfRows=[
    [colr('var(--blue)','P1',true),'1','2','3',colr('var(--green)','0',true),colr('var(--blue)','2',true),mono('3−1−2=0'),mono('3−1=2')],
    [colr('var(--green)','P2',true),'2','5','8',colr('var(--green)','1',true),colr('var(--blue)','6',true),mono('8−2−5=1'),mono('8−2=6')],
    [colr('var(--purple)','P3',true),'2','8','29',colr('var(--green)','19',true),colr('var(--blue)','27',true),mono('29−2−8=19'),mono('29−2=27')],
    [colr('var(--amber)','P4',true),'7','6','14',colr('var(--green)','1',true),colr('var(--blue)','7',true),mono('14−7−6=1'),mono('14−7=7')],
    [colr('var(--red)','P5',true),'10','7','21',colr('var(--green)','4',true),colr('var(--blue)','11',true),mono('21−10−7=4'),mono('21−10=11')],
  ];
  const rrRows=[
    [colr('var(--blue)','P1',true),'1','2','3',colr('var(--green)','0',true),colr('var(--blue)','2',true),mono('3−1−2=0'),mono('3−1=2')],
    [colr('var(--green)','P2',true),'2','5','14',colr('var(--green)','7',true),colr('var(--blue)','12',true),mono('14−2−5=7'),mono('14−2=12')],
    [colr('var(--purple)','P3',true),'2','8','26',colr('var(--green)','16',true),colr('var(--blue)','24',true),mono('26−2−8=16'),mono('26−2=24')],
    [colr('var(--amber)','P4',true),'7','6','24',colr('var(--green)','11',true),colr('var(--blue)','17',true),mono('24−7−6=11'),mono('24−7=17')],
    [colr('var(--red)','P5',true),'10','7','29',colr('var(--green)','12',true),colr('var(--blue)','19',true),mono('29−10−7=12'),mono('29−10=19')],
  ];
  const rows=q2m<2?sjfRows:rrRows;
  const avgWT=q2m<2?'5.0':'9.2',avgTAT=q2m<2?'10.6':'14.8';

  const concepts=[
    `<div class="concept-box">
      <p><strong>SJF Preemptive (SRTF)</strong> — Shortest Remaining Time First. At every moment, the CPU runs whichever ready process has the <em>least remaining burst time</em>. If a new process arrives with a shorter remaining time than the current process, it immediately preempts (kicks out) the running process.</p>
      <p><strong>Why check at arrivals?</strong> A preemption can only happen when a new process arrives. So we only need to re-evaluate priority at each arrival time.</p>
    </div>
    ${secTitle('Step-by-step simulation')}
    <div class="concept-box">
      <p><strong>t=0:</strong> No process yet. CPU is idle.</p>
      <p><strong>t=1:</strong> P1 arrives (burst=2). Only process. P1 starts running. Remaining: P1=2.</p>
      <p><strong>t=2:</strong> P2 (burst=5) and P3 (burst=8) both arrive. Current P1 remaining = ${mono('2−(2−1)=1')}. Compare: P1=1, P2=5, P3=8. <em>P1 is still shortest → no preemption.</em></p>
      <p><strong>t=3:</strong> P1 finishes. Ready queue: P2(5), P3(8). Shortest = P2 → P2 starts.</p>
      <p><strong>t=7:</strong> P4 arrives (burst=6). P2 remaining = ${mono('5−(7−3)=1')}. Compare: P2=1, P3=8, P4=6. <em>P2 still shortest → no preemption.</em></p>
      <p><strong>t=8:</strong> P2 finishes. Ready: P3(8), P4(6). Shortest = P4 → P4 starts.</p>
      <p><strong>t=10:</strong> P5 arrives (burst=7). P4 remaining = ${mono('6−(10−8)=4')}. Compare: P4=4, P3=8, P5=7. <em>P4 still shortest → no preemption.</em></p>
      <p><strong>t=14:</strong> P4 finishes. Ready: P3(8), P5(7). Shortest = P5 → P5 starts.</p>
      <p><strong>t=21:</strong> P5 finishes. Only P3 left → P3 runs until t=29.</p>
    </div>`,

    `<div class="concept-box">
      <p><strong>SJF Non-Preemptive</strong> — Once the CPU picks a process, it runs to completion. Selection happens only when the CPU becomes free.</p>
      <p>At each scheduling point, we look at <em>all processes that have arrived so far</em> and pick the one with the shortest burst. There is no interruption mid-run.</p>
    </div>
    ${secTitle('Step-by-step simulation')}
    <div class="concept-box">
      <p><strong>t=0:</strong> No process. Idle.</p>
      <p><strong>t=1:</strong> P1 arrives. Only process → P1 dispatched. Runs from t=1 to t=3.</p>
      <p><strong>t=3 (decision point):</strong> P1 done. In queue: P2 (arrived t=2, burst=5), P3 (arrived t=2, burst=8). Shortest = P2 → P2 runs t=3 to t=8.</p>
      <p><strong>t=8 (decision point):</strong> P2 done. In queue: P3 (burst=8), P4 (arrived t=7, burst=6). Shortest = P4 → P4 runs t=8 to t=14.</p>
      <p><strong>t=14 (decision point):</strong> P4 done. In queue: P3 (burst=8), P5 (arrived t=10, burst=7). Shortest = P5 → P5 runs t=14 to t=21.</p>
      <p><strong>t=21 (decision point):</strong> P5 done. Only P3 left → P3 runs t=21 to t=29.</p>
    </div>
    ${callout('var(--teal)','<strong>Interesting observation:</strong> In this dataset, both SJF Preemptive and Non-Preemptive produce the same Gantt chart. This happens because no new process ever arrives with a shorter remaining time than the currently running process, so no preemption ever triggers.')}`,

    `<div class="concept-box">
      <p><strong>Round Robin (RR)</strong> — Each process gets a fixed time quantum (q=2). After using its quantum, the process goes to the back of the queue. This is the most <em>fair</em> algorithm: no single process monopolises the CPU.</p>
      <p><strong>Key rule:</strong> If a process finishes before its quantum ends, the CPU moves to the next process immediately. When new processes arrive at the same time a slice ends, they join the queue <em>before</em> the current process re-queues.</p>
    </div>
    ${secTitle('Detailed queue trace (q = 2)')}
    <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Event</th><th>Running</th><th>Ready Queue after</th></tr></thead><tbody>
    ${[
      ['0','CPU idle (no arrivals yet)','—','[]'],
      ['1','P1 arrives','P1 (rem=2)','[]'],
      ['3','P1 done (used full q=2). P2,P3 arrived at t=2','P2 (rem=5)','[P3, P2]'],
      ['5','P2 slice done (rem=3)','P3 (rem=8)','[P2, P3]'],
      ['7','P3 slice done (rem=6). P4 arrives at t=7 → joins before P3 re-queues','P2 (rem=3)','[P4, P3, P2]'],
      ['9','P2 slice done (rem=1)','P4 (rem=6)','[P3, P2, P4]'],
      ['10','P5 arrives mid-P4 slice','P4 continues','[P3, P2, P5, P4]'],
      ['11','P4 slice done (rem=4)','P3 (rem=4)','[P2, P5, P4, P3]'],
      ['13','P3 slice done (rem=4)','P2 (rem=1)','[P5, P4, P3, P2]'],
      ['14','P2 done (only 1 unit left)','P5 (rem=7)','[P4, P3, P5]'],
      ['16','P5 slice done (rem=5)','P4 (rem=2)','[P3, P5, P4]'],
      ['18','P4 slice done (rem=2→done? no rem=2)','P3 (rem=2)','[P5, P4, P3]'],
      ['20','P3 done (rem=2)','P5 (rem=3)','[P4, P5]'],
      ['22','P5 slice done (rem=1)','P4 (rem=2)','[P5, P4]'],
      ['24','P4 done','P5 (rem=1)','[P5]'],
      ['26','P5 done (rem=1, only 1 unit)','—','[]'],
    ].map(r=>`<tr><td class="left">${mono(r[0])}</td><td>${r[1]}</td><td style="color:var(--amber);font-family:var(--mono);font-size:11px">${r[2]}</td><td style="font-family:var(--mono);font-size:10px;color:var(--dim)">${r[3]}</td></tr>`).join('')}
    </tbody></table></div>`,
  ];

  return`
<div class="q-header">
  <div class="tag-row">${pill('var(--blue)','CPU')}<span style="color:var(--muted);font-size:11px">CPU scheduling algorithms</span></div>
  <h2>${colr('var(--blue)','Q2')} · SJF &amp; Round Robin</h2>
</div>
<div class="concept-box">
  <p><strong>Process table:</strong> P1(arr=1,bt=2) · P2(arr=2,bt=5) · P3(arr=2,bt=8) · P4(arr=7,bt=6) · P5(arr=10,bt=7)</p>
</div>
${toggleGroup(opts,q2m,'setQ2')}
${concepts[q2m]}
${secTitle('Gantt Chart')}
${gantt(segs,29,cmap)}
${secTitle('WT & TAT Calculations')}
${formula('Key formulas','Waiting Time (WT) = Finish − Arrival − Burst Time<br>Turnaround Time (TAT) = Finish − Arrival Time')}
${tbl(
  ['Process','Arrival','Burst','Finish',colr('var(--green)','WT'),colr('var(--blue)','TAT'),'WT calc','TAT calc'],
  rows,
  ['Averages','','','',colr('var(--green)',avgWT),colr('var(--blue)',avgTAT),'',''],
  'WT = time spent waiting (not on CPU) | TAT = total time from arrival to completion'
)}
${callout('var(--amber)',`<strong>Comparison insight:</strong> SJF gives Avg WT = 5.0, Round Robin gives 9.2. SJF is theoretically optimal for minimising WT, but requires knowing burst times in advance. RR is fairer — no process waits more than (n−1)×q time units.`)}
`;
}

/* ===================== Q3 ===================== */
let q3m=0;
function renderQ3(){
  const opts=[{l:'First Fit',c:'var(--blue)'},{l:'Next Fit',c:'var(--amber)'},{l:'Best Fit',c:'var(--green)'}];
  const blocks=[100,500,200,300,600];
  const jobs=[{id:'J1',size:70},{id:'J2',size:160},{id:'J3',size:260},{id:'J4',size:150},{id:'J5',size:80}];

  const allocs=[
    // First Fit
    [
      {block:1,bsize:100,job:'J1',jsize:70,frag:30},
      {block:2,bsize:500,job:'J2+J3+J5',jsize:500,frag:0},
      {block:3,bsize:200,job:'J4',jsize:150,frag:50},
      {block:4,bsize:300,job:'—',jsize:0,frag:null},
      {block:5,bsize:600,job:'—',jsize:0,frag:null},
    ],
    // Next Fit
    [
      {block:1,bsize:100,job:'J1',jsize:70,frag:30},
      {block:2,bsize:500,job:'J2+J3',jsize:420,frag:80},
      {block:3,bsize:200,job:'J4',jsize:150,frag:50},
      {block:4,bsize:300,job:'J5',jsize:80,frag:220},
      {block:5,bsize:600,job:'—',jsize:0,frag:null},
    ],
    // Best Fit
    [
      {block:1,bsize:100,job:'J1',jsize:70,frag:30},
      {block:2,bsize:500,job:'J4+J5',jsize:230,frag:270},
      {block:3,bsize:200,job:'J2',jsize:160,frag:40},
      {block:4,bsize:300,job:'J3',jsize:260,frag:40},
      {block:5,bsize:600,job:'—',jsize:0,frag:null},
    ],
  ];

  const stepsByAlgo=[
    // First Fit steps
    `<div class="concept-box">
      <p><strong>Rule:</strong> Scan from Block 1 every time. Use the first block big enough.</p>
      <p><strong>J1 (70K):</strong> Start at Block 1 (100K). 100≥70 ✓ → Block 1. Remaining = 30K.</p>
      <p><strong>J2 (160K):</strong> Block 1 remaining=30K &lt; 160 ✗. Block 2 (500K) ≥ 160 ✓ → Block 2. Remaining = 340K.</p>
      <p><strong>J3 (260K):</strong> Block 1=30K ✗. Block 2 remaining=340K ≥ 260 ✓ → Block 2. Remaining = 80K.</p>
      <p><strong>J4 (150K):</strong> Block 1=30K ✗. Block 2=80K ✗. Block 3 (200K) ≥ 150 ✓ → Block 3. Remaining = 50K.</p>
      <p><strong>J5 (80K):</strong> Block 1=30K ✗. Block 2=80K ≥ 80 ✓ → Block 2. Remaining = 0K.</p>
    </div>`,
    // Next Fit steps
    `<div class="concept-box">
      <p><strong>Rule:</strong> Like First Fit, but start scanning from where you last allocated (pointer wraps around).</p>
      <p><strong>J1 (70K):</strong> Pointer at Block 1. 100K≥70 ✓ → Block 1. Pointer stays at Block 1. Remaining=30K.</p>
      <p><strong>J2 (160K):</strong> Continue from Block 1 (30K&lt;160 ✗). Block 2 (500K)≥160 ✓ → Block 2. Pointer→Block 2. Remaining=340K.</p>
      <p><strong>J3 (260K):</strong> Continue from Block 2 (340K≥260 ✓) → Block 2. Pointer stays. Remaining=80K.</p>
      <p><strong>J4 (150K):</strong> Continue from Block 2 (80K&lt;150 ✗). Block 3 (200K)≥150 ✓ → Block 3. Pointer→Block 3. Remaining=50K.</p>
      <p><strong>J5 (80K):</strong> Continue from Block 3 (50K&lt;80 ✗). Block 4 (300K)≥80 ✓ → Block 4. Remaining=220K.</p>
    </div>`,
    // Best Fit steps
    `<div class="concept-box">
      <p><strong>Rule:</strong> For each job, search ALL blocks. Choose the smallest block that still fits — minimises wasted space per allocation.</p>
      <p><strong>J1 (70K):</strong> Candidates ≥70K: 100K,500K,200K,300K,600K. Smallest=Block 1 (100K). Frag=30K.</p>
      <p><strong>J2 (160K):</strong> Candidates ≥160K: 500K,200K,300K,600K. Smallest=Block 3 (200K). Frag=40K.</p>
      <p><strong>J3 (260K):</strong> Candidates ≥260K: 500K,300K,600K. Smallest=Block 4 (300K). Frag=40K.</p>
      <p><strong>J4 (150K):</strong> Block 3 now 40K left, Block 4 now 40K left. Candidates ≥150K: 500K,600K. Smallest=Block 2 (500K). Frag=270K.</p>
      <p><strong>J5 (80K):</strong> Block 2 has 270K left. Candidates ≥80K: Block 2(270K),Block 5(600K). Smallest=Block 2. Remaining=190K.</p>
    </div>`,
  ];

  const cur=allocs[q3m];
  const totalFrag=cur.reduce((s,r)=>s+(r.frag||0),0);
  const rows=cur.map(r=>{
    const isFree=r.job==='—';
    const pct=r.bsize>0?((r.frag||0)/r.bsize*100):0;
    const fragBar=r.frag&&r.frag>0?`<div style="height:5px;width:80px;background:var(--border);border-radius:3px;display:inline-block;vertical-align:middle;margin-left:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${r.frag>100?'var(--red)':r.frag>30?'var(--amber)':'var(--green)'};border-radius:3px"></div></div>`:'';
    const statusBadge=isFree?badge('badge-warn','FREE'):r.frag===0?`<span class="badge" style="background:rgba(61,214,140,.15);color:var(--green)">FULL</span>`:`<span class="badge badge-warn">PARTIAL</span>`;
    const fragDisp=r.frag!==null?`<span style="color:${r.frag>100?'var(--red)':r.frag>30?'var(--amber)':'var(--green)'};font-weight:700;font-family:var(--mono)">${r.frag}K</span>${fragBar}`:'<span style="color:var(--muted)">—</span>';
    return[
      colr('var(--amber)',r.block,true),
      `${r.bsize}K`,
      isFree?colr('var(--muted)','—'):colr('var(--green)',r.job,true),
      r.jsize>0?`${r.jsize}K`:'—',
      statusBadge,
      fragDisp,
    ];
  });

  return`
<div class="q-header">
  <div class="tag-row">${pill('var(--purple)','MEM')}<span style="color:var(--muted);font-size:11px">Contiguous memory allocation</span></div>
  <h2>${colr('var(--purple)','Q3')} · Memory Allocation Algorithms</h2>
</div>
<div class="concept-box">
  <p><strong>What is memory allocation?</strong> The OS must fit variable-sized jobs into fixed memory blocks. The challenge: blocks may not perfectly match job sizes, leaving wasted space called <em>internal fragmentation</em>.</p>
  <p><strong>Memory blocks:</strong> 100K · 500K · 200K · 300K · 600K</p>
  <p><strong>Jobs to fit:</strong> J1=70K · J2=160K · J3=260K · J4=150K · J5=80K</p>
</div>
${formula('Internal Fragmentation formula','Internal Fragmentation = Block Size − Job Size (only when block is used)')}
${toggleGroup(opts,q3m,'setQ3')}
${secTitle('Step-by-step allocation trace')}
${stepsByAlgo[q3m]}
${secTitle('Resulting allocation table')}
${tbl(
  ['Block','Block Size','Job(s) Allocated','Total Job Size','Status','Internal Fragmentation'],
  rows,
  ['','','','',`<span style="color:var(--red)">Total</span>`,colr('var(--red)',totalFrag+'K',true)],
  'Internal Fragmentation = wasted space inside a block (block size minus job size)'
)}
${callout('var(--purple)','<strong>Best Fit paradox:</strong> Best Fit seems like it should create the least fragmentation, but it actually creates many small unusable leftover pieces scattered across blocks. First Fit and Next Fit leave larger contiguous free spaces that are more likely to be reused by future jobs.')}
`;
}
function setQ3(i){q3m=i;rerender(2)}

/* ===================== Q4 ===================== */
let q4m=0;
function renderQ4(){
  const opts=[{l:'FIFO',c:'var(--blue)'},{l:'LRU',c:'var(--amber)'},{l:'Optimal',c:'var(--green)'}];
  const ref=['A','B','C','D','E','C','A','B','C','D','F'];

    },
    {hits:2,faults:9,evict:['—','—','—','—','A','—','B','D','—','E','A'],
     frames:[['A','','',''],['A','B','',''],['A','B','C',''],['A','B','C','D'],['E','B','C','D'],['E','B','C','D'],['E','A','C','D'],['E','A','C','B'],['E','A','C','B'],['D','A','C','B'],['D','F','C','B']],
     res:['fault','fault','fault','fault','fault','hit','fault','fault','hit','fault','fault'],
     explain:[
       'Load A. LRU order (oldest→newest): [A]',
       'Load B. Order: [A,B]',
       'Load C. Order: [A,B,C]',
       'Load D. Order: [A,B,C,D]',
       'Full. LRU = A (last used at step 1, most stale). Evict A. Order: [B,C,D,E]',
       'C is present → HIT! Update: C becomes most recent. Order: [B,D,E,C]',
       'Full. LRU = B (last used step 2). Evict B. Order: [D,E,C,A]',
       'Full. LRU = D (last used step 4, never hit since). Evict D. Order: [E,C,A,B]',
       'C is present → HIT! Update C. Order: [E,A,B,C]',
       'Full. LRU = E (last used step 5). Evict E. Order: [A,C,B,D]',
       'Full. LRU = A (last used step 7). Evict A. Order: [C,B,D,F]',
     ]
    },
    {hits:4,faults:7,evict:['—','—','—','—','D','—','—','—','—','E','A'],
     frames:[['A','','',''],['A','B','',''],['A','B','C',''],['A','B','C','D'],['A','B','C','E'],['A','B','C','E'],['A','B','C','E'],['A','B','C','E'],['A','B','C','E'],['A','B','C','D'],['F','B','C','D']],
     res:['fault','fault','fault','fault','fault','hit','hit','hit','hit','fault','fault'],
     explain:[
       'Load A. Frames: {A,_,_,_}',

       'Load D. Frames: {A,B,C,D}',
       'Full. Look ahead: A→step7, B→step8, C→step6, D→step10. D is used LATEST. Evict D. Load E.',
       'C in frames → HIT!',

  const cur=data[q4m];
  const mc=opts[q4m].c;
  const fcols=['var(--blue)','var(--green)','var(--purple)','var(--amber)'];

  const tableRows=cur.frames.map((fr,i)=>{
    const r=ref[i];
    const isHit=cur.res[i]==='hit';
    const fCells=fr.map((f,fi)=>{
      if(!f)return'<span style="color:var(--border2)">—</span>';

  const algoExplain=[
    `<div class="concept-box">
      <p><strong>FIFO — First In First Out.</strong> Tracks the order pages were loaded. When a page fault occurs and frames are full, the page that has been in memory the <em>longest</em> is evicted — like a queue.</p>
      <p><strong>Easy to implement</strong> (just need a queue), but can suffer from <em>Bélády's anomaly</em> — adding more frames can sometimes cause more faults!</p>
    </div>`,
    `<div class="concept-box">
      <p><strong>LRU — Least Recently Used.</strong> Tracks the last time each page was referenced. When evicting, remove the page that was used <em>least recently</em> (furthest in the past).</p>

    ['DMA','Setup + one ISR only','Once per full block','Disks, NICs, GPUs'],
  ].map((r,i)=>[`<span style="color:${['var(--red)','var(--amber)','var(--green)'][i]};font-weight:${i===q7m?700:400}">${r[0]}</span>`,r[1],r[2],r[3]]);

  return`
<div class="q-header">
  <div class="tag-row">${pill('var(--red)','I/O')}<span style="color:var(--muted);font-size:11px">How each technique improves CPU performance</span></div>
  <h2>${colr('var(--red)','Q7')} · I/O Techniques</h2>
</div>
<div class="concept-box">
  <p><strong>Why does I/O technique matter?</strong> I/O devices (disks, keyboards, network cards) are thousands to millions of times slower than the CPU. Without smart I/O handling, the CPU would be idle most of the time waiting for devices.</p>
  <p><strong>Goal:</strong> Keep the CPU doing useful work as much as possible while I/O operations proceed.</p>
</div>
<div style="display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap">
  ${techniques.map((t,i)=>`<button class="io-tab${i===q7m?' active':''}" onclick="setQ7(${i})" style="${i===q7m?`border-color:${t.color};background:${t.color}18`:''};flex:1 1 130px">
    <div class="it-title" style="color:${i===q7m?t.color:'var(--text)'}">${t.title}</div>
    <div class="it-sub">${t.sub}</div>
  </button>`).join('')}
</div>
<div class="io-panel" style="background:${cur.color}0e;border:1px solid ${cur.color}44">
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">
    <div>
      <h3 style="font-size:18px;font-weight:700;color:${cur.color}">${cur.title}</h3>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${cur.sub}</div>
    </div>
    <div>
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px;font-family:var(--mono)">CPU efficiency gained</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="height:10px;width:130px;background:var(--border);border-radius:5px;overflow:hidden">
          <div style="height:100%;width:${cur.perf}%;background:${cur.color};border-radius:5px"></div>
        </div>
        <span style="color:${cur.color};font-weight:700;font-size:13px;font-family:var(--mono)">${cur.perfLabel}</span>
      </div>
    </div>
  </div>
  <div class="concept-box" style="margin-bottom:16px">
    <p><strong>How it works:</strong> ${cur.what}</p>
  </div>
  <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-family:var(--mono)">Step-by-step execution</div>
  ${cur.steps.map((s,i)=>`<div style="display:flex;gap:12px;margin-bottom:12px;align-items:flex-start">
    <div style="width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:700;font-family:var(--mono);background:${cur.color}30;color:${cur.color};margin-top:1px">${i+1}</div>
    <div><div style="font-size:13px;font-weight:600;margin-bottom:2px">${s.t}</div><div style="font-size:12px;color:var(--dim);line-height:1.65">${s.d}</div></div>
  </div>`).join('')}
  <div style="background:${cur.color}18;border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.65;margin-bottom:10px">
    <strong style="color:${cur.color}">Performance impact:</strong> ${cur.impact}
  </div>
  <div style="font-size:12px;color:var(--muted)"><strong>Best suited for:</strong> ${cur.use}</div>
</div>
${secTitle('Comparison: all three techniques')}
${tbl(
  ['Technique','CPU involvement','Interrupts generated','Best use case'],
  cmpRows,null
)}
${callout('var(--teal)','<strong>Modern systems use all three:</strong> Simple status checks (Programmed I/O) for flags, interrupt-driven for human-speed devices (keyboard), and DMA for high-bandwidth transfers (disk, NIC). They are complementary tools, not alternatives.')}
`;
}
function setQ7(i){q7m=i;rerender(6)}

/* ── CORE ENGINE ── */
const renderers=[renderQ1,renderQ2,renderQ3,renderQ4,renderQ5,renderQ6,renderQ7];
function rerender(idx){
  const p=document.getElementById(`panel-${idx}`);
  if(p)p.innerHTML=renderers[idx]();
}

function switchTo(idx){
  document.querySelectorAll('.q-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(`panel-${idx}`).classList.add('active');
  document.querySelectorAll('.sidebar-btn').forEach((b,i)=>{
    b.classList.toggle('active',i===idx);
    b.style.setProperty('--ac',questions[i].color);
  });
  document.querySelectorAll('.mobile-tab').forEach((t,i)=>{
    t.classList.toggle('active',i===idx);
    t.style.color=i===idx?questions[i].color:'';
    t.style.borderBottomColor=i===idx?questions[i].color:'';
  });
  const mt=document.querySelectorAll('.mobile-tab')[idx];
  if(mt)mt.scrollIntoView({inline:'center',behavior:'smooth'});
}

function init(){
  const sidebar=document.getElementById('sidebar');
  const mobileNav=document.getElementById('mobile-nav');
  const content=document.getElementById('content');
  questions.forEach((q,i)=>{
    const sb=document.createElement('button');
    sb.className='sidebar-btn';
    sb.style.setProperty('--ac',q.color);
    sb.innerHTML=`<span class="qnum" style="color:${q.color}">${q.num}</span><div><div class="qtitle">${q.title}</div><div class="qsub">${q.sub}</div></div>`;
    sb.onclick=()=>switchTo(i);
    sidebar.appendChild(sb);
    const mt=document.createElement('button');
    mt.className='mobile-tab';
    mt.innerHTML=`${q.num} <span style="font-size:10px;opacity:.7">${q.title}</span>`;
    mt.onclick=()=>switchTo(i);
    mobileNav.appendChild(mt);
    const panel=document.createElement('div');
    panel.className='q-panel';
    panel.id=`panel-${i}`;
    panel.innerHTML=renderers[i]();
    content.appendChild(panel);
  });
  switchTo(0);
}
init();
</script>
</body>
</html>
